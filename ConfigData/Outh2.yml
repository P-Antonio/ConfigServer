server:
  port: ${PORT:${SERVER_PORT:0}}

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/Keycloak-realm-dev
          jwk-set-uri: http://localhost:9090/realms/Keycloak-realm-dev/protocol/openid-connect/certs

jwt:
  oauth2:
    converter:
      atributos-principales: preferred_username
      resource-id: spring-client

  #informacion en consola
logging:
  level:
    org:
      keycloak: DEBUG