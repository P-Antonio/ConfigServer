server:
  port: 8080

eureka:
  intance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: EmpresaInnova
          uri: lb://EmpresaInnova
          predicates:
            - Path=/empresa/**
          filters:
            - tokenRelay =
        - id: MyGranProyecto
          uri: lb://MyGranProyecto
          predicates:
            - Path=/producto/**
          filters:
            - tokenRelay =


  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: spring-client
            client-secret: J7dDeQlfxoRMdg5aDKZWJIZ8Tk1EuPkA
            provider: keycloak
            authorization-grant-type: authorization-code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            token-uri: http://localhost:9090/realms/Keycloak-realm-dev/protocol/openid-connect/token
            user-info-uri: http://localhost:9090/realms/Keycloak-realm-dev/protocol/openid-connect/userinfo
            jwk-set-uri: http://localhost:9090/realms/Keycloak-realm-dev/protocol/openid-connect/certs
            issuer-uri: http://localhost:9090/realms/Keycloak-realm-dev
    resourceserver:
      jwt:
        issuer-uri: http://localhost:9090/realms/Keycloak-realm-dev


