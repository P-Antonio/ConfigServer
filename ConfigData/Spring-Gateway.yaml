server:
  port: 8080

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


spring:
  cloud:
    gateway:
      default-filters:
        - TokenRelay
      discovery:
        locator:
          enabled: true
      routes:
        - id: Oauth2
          uri: lb://Oauth2
          predicates:
            - Path=/auth/**
        - id: EmpresaInnova
          uri: lb://EmpresaInnova
          predicates:
            - Path=/empresa/**
          filters:
            - RemoveRequestHeader=Cookie
        - id: MyGranProyecto
          uri: lb://MyGranProyecto
          predicates:
            - Path=/producto/**
          filters:
            - RemoveRequestHeader=Cookie


  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: http://localhost:9090/realms/Keycloak-realm-dev/protocol/openid-connect/auth
            userinfo-uri: http://localhost:9090/realms/Keycloak-realm-dev/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
            token-uri: http://localhost:9090/realms/Keycloak-realm-dev/protocol/openid-connect/token
        registration:
          spring-client:
            provider: keycloak
            client-id: spring-client
            client-secret: J7dDeQlfxoRMdg5aDKZWJIZ8Tk1EuPkA
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

    resourceserver:
      jwt:
        issuer-uri: http://localhost:9090/realms/Keycloak-realm-dev


